name: Transfer CalDAV settings once

on:
  workflow_dispatch:
    inputs:
      public_key_b64:
        description: One-time RSA public key (base64 PEM)
        required: true
        type: string

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt CalDAV settings for the current Cloud Shell session
        env:
          PUBLIC_KEY_B64: ${{ inputs.public_key_b64 }}
          CALDAV_SERVER_URL: ${{ secrets.CALDAV_SERVER_URL }}
          CALDAV_USERNAME: ${{ secrets.CALDAV_USERNAME }}
          CALDAV_PASSWORD: ${{ secrets.CALDAV_PASSWORD }}
          CALDAV_LABEL: ${{ secrets.CALDAV_LABEL }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const names = ['CALDAV_SERVER_URL', 'CALDAV_USERNAME', 'CALDAV_PASSWORD', 'CALDAV_LABEL'];
          if (names.slice(0, 3).some(name => !process.env[name])) throw new Error('CalDAV settings are incomplete');
          const payload = JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name] || ''])));
          const key = crypto.randomBytes(32);
          const iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
          const ciphertext = Buffer.concat([cipher.update(payload, 'utf8'), cipher.final()]);
          const encryptedKey = crypto.publicEncrypt({
            key: Buffer.from(process.env.PUBLIC_KEY_B64, 'base64').toString('utf8'),
            oaepHash: 'sha256',
          }, key);
          const envelope = Buffer.concat([encryptedKey, iv, cipher.getAuthTag(), ciphertext]);
          console.log(`CALDAV_ENVELOPE=${envelope.toString('base64')}`);
          NODE
